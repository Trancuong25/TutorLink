name: tutorlink
description: Nguyên mẫu nghiên cứu tìm gia sư theo vị trí và đa tiêu chí.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  go_router: 18.1.0
  firebase_core: 5.0.0
  firebase_auth: 7.0.0
  cloud_firestore: 7.0.0
  flutter_dotenv: 6.0.1
  geolocator: 14.1.1
  flutter_map: 8.3.2
  flutter_map_marker_cluster: 8.2.2
  latlong2: 0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: 4.0.9
  build_runner: 2.16.2
  flutter_lints: 6.0.0
  mocktail: 1.0.5
flutter:
  uses-material-design: true
  assets:
    - .env
